<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5 d-flex justify-content-center">

<div th:fragment="registerForm" class="col-12" style="max-width: 480px; margin: 0 auto;">

    <div class="card p-4">
        <h5 class="fw-bold mb-4" style="color: var(--navy);">
            Register as
            <span th:text="${role != null ? #strings.capitalize(#strings.toLowerCase(role.name())) : 'User'}">User</span>
        </h5>

        <!-- Error alert -->
        <div th:if="${error != null}"
             class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}">An error occurred.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">

            <!-- Hidden role field -->
            <input type="hidden" th:field="*{role}"/>

            <div class="mb-3">
                <label for="regEmail" class="form-label fw-semibold">Email address</label>
                <input type="email"
                       id="regEmail"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       class="form-control"
                       placeholder="you@example.com"
                       autofocus/>
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="regPassword" class="form-label fw-semibold">Password</label>
                <input type="password"
                       id="regPassword"
                       th:field="*{password}"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       class="form-control"
                       placeholder="At least 8 characters"/>
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>

            <div class="mb-4">
                <label for="regConfirmPassword" class="form-label fw-semibold">Confirm Password</label>
                <input type="password"
                       id="regConfirmPassword"
                       th:field="*{confirmPassword}"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                       class="form-control"
                       placeholder="Repeat your password"/>
                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-accent btn-lg">Create Account</button>
            </div>
        </form>

        <!-- Divider -->
        <div class="d-flex align-items-center my-3">
            <hr class="flex-grow-1"/>
            <span class="px-3 text-muted small">or</span>
            <hr class="flex-grow-1"/>
        </div>

        <!-- Google OAuth2 sign-up -->
        <div class="d-grid">
            <a th:href="@{/register/oauth2/google(role=${role})}"
               class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.5-1.45-.79-3-.79-4.59s.29-3.14.79-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                </svg>
                Sign up with Google
            </a>
        </div>
    </div>

</div>

</div>

</body>
</html>
