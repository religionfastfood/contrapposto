<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${eventId} != null ? 'Edit Event' : 'Post an Event')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5" style="max-width: 640px;">

    <h2 class="fw-bold mb-1" th:text="${eventId} != null ? 'Edit Event' : 'Post an Event'">Post an Event</h2>
    <p class="text-muted mb-4">Set the type, date, location, and price for your session.</p>
    <hr class="section-divider mb-4"/>

    <div class="card p-4">
        <form th:action="${eventId} != null ? @{/organizer/events/{id}(id=${eventId})} : @{/organizer/events}"
              th:object="${eventRequest}" method="post">

            <div class="mb-3">
                <label for="eventTypeId" class="form-label fw-semibold">Event type</label>
                <select id="eventTypeId" th:field="*{eventTypeId}"
                        th:classappend="${#fields.hasErrors('eventTypeId')} ? 'is-invalid'"
                        class="form-select">
                    <option value="" disabled>Select a type&hellip;</option>
                    <option th:each="type : ${eventTypes}" th:value="${type.id}" th:text="${type.name}">Type</option>
                </select>
                <div class="invalid-feedback" th:errors="*{eventTypeId}"></div>
            </div>

            <div class="mb-3">
                <label for="title" class="form-label fw-semibold">Title</label>
                <input type="text" id="title" th:field="*{title}"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                       class="form-control" placeholder="e.g. Tuesday Evening Gesture Drawing"/>
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Description</label>
                <textarea id="description" th:field="*{description}" rows="4"
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                          class="form-control" placeholder="Session details, skill level, what to bring, etc."></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-sm-6">
                    <label for="city" class="form-label fw-semibold">City</label>
                    <input type="text" id="city" th:field="*{city}"
                           th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'"
                           class="form-control" placeholder="City"/>
                    <div class="invalid-feedback" th:errors="*{city}"></div>
                </div>
                <div class="col-sm-6">
                    <label for="location" class="form-label fw-semibold">Location</label>
                    <input type="text" id="location" th:field="*{location}"
                           th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                           class="form-control" placeholder="Venue or address"/>
                    <div class="invalid-feedback" th:errors="*{location}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="startTime" class="form-label fw-semibold">Date &amp; time</label>
                <input type="datetime-local" id="startTime" th:field="*{startTime}"
                       th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'"
                       class="form-control"/>
                <div class="invalid-feedback" th:errors="*{startTime}"></div>
            </div>

            <div class="mb-3">
                <label for="priceAmount" class="form-label fw-semibold">Price (USD)</label>
                <input type="number" id="priceAmount" th:field="*{priceAmount}" step="0.01" min="0"
                       th:classappend="${#fields.hasErrors('priceAmount')} ? 'is-invalid'"
                       class="form-control" placeholder="Leave blank if free"/>
                <div class="invalid-feedback" th:errors="*{priceAmount}"></div>
            </div>

            <div class="mb-4">
                <label for="externalLink" class="form-label fw-semibold">External link</label>
                <input type="text" id="externalLink" th:field="*{externalLink}"
                       th:classappend="${#fields.hasErrors('externalLink')} ? 'is-invalid'"
                       class="form-control" placeholder="Registration page, Meetup event, etc."/>
                <div class="invalid-feedback" th:errors="*{externalLink}"></div>
            </div>

            <button type="submit" class="btn btn-accent" th:text="${eventId} != null ? 'Save Changes' : 'Post Event'">Post Event</button>
        </form>
    </div>

</div>

</body>
</html>
