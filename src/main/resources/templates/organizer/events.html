<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Events')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-2">
        <div>
            <h2 class="fw-bold mb-1">My Events</h2>
            <p class="text-muted mb-0">Manage the sessions you've posted.</p>
        </div>
        <a th:href="@{/organizer/events/new}" class="btn btn-accent">Post an Event</a>
    </div>
    <hr class="section-divider mb-4"/>

    <div th:if="${success}" class="alert alert-success mb-4" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger mb-4" th:text="${error}"></div>

    <p th:if="${events.isEmpty()}" class="text-muted">You haven't posted any events yet.</p>

    <div class="row g-4">
        <div class="col-md-6" th:each="event : ${events}">
            <div class="card h-100 p-4">
                <span class="badge rounded-pill mb-2" style="background-color: var(--accent); color: var(--white); width: fit-content;"
                      th:text="${event.eventType.name}">Type</span>
                <h5 class="fw-bold mb-1" th:text="${event.title}">Title</h5>
                <p class="text-muted small mb-2"
                   th:text="${#temporals.format(event.startTime, 'MMM d, yyyy h:mm a')} + ' &middot; ' + ${event.city}">
                    When &middot; City
                </p>
                <p class="mb-3" th:if="${not #strings.isEmpty(event.description)}"
                   th:text="${#strings.abbreviate(event.description, 140)}">Description excerpt</p>
                <p th:replace="~{fragments/event-card :: modelLine(${assignedModels.get(event.id)})}"></p>
                <span th:if="${event.startTime.isBefore(now)}" class="text-muted small mb-3">Past event</span>
                <div class="d-flex gap-2 mt-auto">
                    <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-secondary btn-sm">View</a>
                    <a th:href="@{/organizer/events/{id}/edit(id=${event.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                    <form th:action="@{/organizer/events/{id}/delete(id=${event.id})}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
