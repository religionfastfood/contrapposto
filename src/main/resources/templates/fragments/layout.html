<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- HEAD FRAGMENT -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <title th:text="${title} + ' | Contrapposto'">Contrapposto</title>
    <style>
        :root {
            --navy: #1a2744;
            --cream: #f5f0e8;
            --accent: #c8a96e;
            --text-dark: #1a2744;
        }

        body {
            background-color: var(--cream);
            color: var(--text-dark);
            font-family: 'Georgia', serif;
        }

        .navbar {
            background-color: var(--navy) !important;
        }

        .navbar-brand {
            color: var(--cream) !important;
            font-size: 1.5rem;
            letter-spacing: 0.05em;
        }

        .navbar-brand:hover {
            color: var(--accent) !important;
        }

        .nav-link {
            color: rgba(245, 240, 232, 0.85) !important;
        }

        .nav-link:hover {
            color: var(--accent) !important;
        }

        .btn-outline-cream {
            color: var(--cream);
            border-color: var(--cream);
        }

        .btn-outline-cream:hover {
            background-color: var(--cream);
            color: var(--navy);
        }

        .btn-accent {
            background-color: var(--accent);
            border-color: var(--accent);
            color: var(--navy);
            font-weight: 600;
        }

        .btn-accent:hover {
            background-color: #b5943e;
            border-color: #b5943e;
            color: #fff;
        }

        .card {
            border: none;
            box-shadow: 0 2px 12px rgba(26, 39, 68, 0.08);
        }

        .hero-section {
            background: linear-gradient(135deg, var(--navy) 0%, #2d4070 100%);
            color: var(--cream);
            padding: 5rem 0;
        }

        .hero-section h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .section-divider {
            border-color: var(--accent);
            opacity: 0.4;
        }
    </style>
</head>

<!-- NAVBAR FRAGMENT -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Contrapposto</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ORGANIZER')">
                    <a class="nav-link" th:href="@{/organizer/dashboard}">My Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('MODEL')">
                    <a class="nav-link" th:href="@{/model/dashboard}">My Dashboard</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <!-- Not authenticated -->
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-cream btn-sm">Login</a>
                    <a th:href="@{/register}" class="btn btn-accent btn-sm">Register</a>
                </div>

                <!-- Authenticated -->
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <span class="text-light opacity-75 small"
                          sec:authentication="name"></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-cream btn-sm">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmE6pB8jqnfaM0wmcFafCyH7jxe"
        crossorigin="anonymous" th:inline="none"></script>

<!-- HTMX -->
<script src="https://unpkg.com/htmx.org@2.0.0" th:inline="none"></script>

</html>
