<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- HEAD FRAGMENT -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous"/>
    <title th:text="${title} + ' | Contrapposto'">Contrapposto</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous" th:inline="none"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0" th:inline="none"></script>
    <style>
        :root {
            --navy:      #111111;
            --white:     #ffffff;
            --accent:    #111111;
            --text-dark: #111111;
        }

        /* --- Base --- */
        body {
            background-color: #ffffff;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-dark);
            font-family: 'DM Sans', system-ui, sans-serif;
        }

        a {
            color: var(--navy);
        }

        /* --- Navbar --- */
        .navbar {
            background-color: #ffffff !important;
            border-top: 1px solid #111111;
            border-bottom: 1px solid #111111;
        }

        .navbar-brand {
            color: #111111 !important;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .navbar-brand:hover {
            color: #444444 !important;
        }

        .nav-link {
            color: rgba(17, 17, 17, 0.6) !important;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
        }

        .nav-link:hover, .nav-link.active {
            color: #111111 !important;
        }

        /* --- Buttons --- */
        .btn {
            border-radius: 0;
        }

        .btn-outline-cream {
            color: #111111;
            border: 1px solid #111111;
            border-radius: 0;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .btn-outline-cream:hover {
            background-color: #111111;
            border-color: #111111;
            color: #ffffff;
        }

        .btn-accent {
            background-color: #111111;
            border: 1px solid #111111;
            color: #ffffff;
            font-weight: 600;
            border-radius: 0;
            letter-spacing: 0.03em;
        }

        .btn-accent:hover {
            background-color: #333333;
            border-color: #333333;
            color: #ffffff;
        }

        .btn-outline-secondary {
            border: 1px solid #111111;
            color: #111111;
            border-radius: 0;
            background: #ffffff;
        }

        .btn-outline-secondary:hover {
            background-color: #111111;
            color: #ffffff;
            border-color: #111111;
        }

        .btn-outline-light {
            border-radius: 0;
        }

        /* --- Cards --- */
        .card {
            border: 1px solid #111111;
            border-radius: 0;
            box-shadow: none;
            background-color: #ffffff;
        }

        /* --- Form controls --- */
        .form-control, .form-select {
            border: 1px solid #111111;
            border-radius: 0;
            background-color: #ffffff;
        }

        .form-control:focus, .form-select:focus {
            border-color: #111111;
            box-shadow: none;
            outline: 2px solid #111111;
            outline-offset: 1px;
        }

        .form-control.is-invalid {
            border-color: #dc3545;
        }

        /* --- Utilities --- */
        .text-navy {
            color: #111111 !important;
        }

        .link-navy {
            color: #111111;
            font-weight: 600;
            text-decoration: underline;
        }

        .link-navy:hover {
            color: #444444;
        }

        /* --- Hero --- */
        .hero-section {
            background-color: #111111;
            color: #f2f3f7;
            padding: 5rem 0;
            border-bottom: 1px solid #111111;
        }

        .hero-section h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        /* --- Divider --- */
        .section-divider {
            border-color: #111111;
            opacity: 0.2;
        }

        /* --- Footer --- */
        .site-footer {
            background-color: #111111;
            color: rgba(242, 243, 247, 0.55);
            border-top: 1px solid #111111;
        }
    </style>
</head>

<!-- NAVBAR FRAGMENT -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Contrapposto</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ORGANIZER')">
                    <a class="nav-link" th:href="@{/organizer/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ORGANIZER')">
                    <a class="nav-link" th:href="@{/organizer/applications}">Applications</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('MODEL')">
                    <a class="nav-link" th:href="@{/model/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('MODEL')">
                    <a class="nav-link" th:href="@{/model/applications}">Applications</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated() and hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Admin</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2">
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-cream btn-sm">Login</a>
                    <a th:href="@{/register}" class="btn btn-accent btn-sm">Register</a>
                </div>

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <span class="text-light opacity-75 small" sec:authentication="name"></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-cream btn-sm">Logout</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>

</html>
