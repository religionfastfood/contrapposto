spring.application.name=contrapposto

# JPA / HSQLDB
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# OAuth2 - Google (uncomment and set env vars to enable)
#spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
#spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
#spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Stripe (set env vars to enable; app runs without them)
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.prices.model-monthly=${STRIPE_PRICE_MODEL_MONTHLY:}
stripe.prices.model-annual=${STRIPE_PRICE_MODEL_ANNUAL:}
stripe.prices.organizer-monthly=${STRIPE_PRICE_ORGANIZER_MONTHLY:}
stripe.prices.organizer-annual=${STRIPE_PRICE_ORGANIZER_ANNUAL:}

# Application base URL (used for Stripe callback URLs — set this in production)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# AWS S3 (set env vars to enable; falls back to local disk storage under ./local-uploads/ without them)
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}

# Photo uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Thymeleaf
spring.thymeleaf.cache=false

# Dev user seeding — creates admin/model/organizer test accounts on every startup
# (model/organizer are seeded with ACTIVE subscriptions, skipping the Stripe flow).
# Set SEED_DEV_USERS=false to disable (e.g. before a real deployment).
app.seed-dev-users.enabled=${SEED_DEV_USERS:true}
app.seed-dev-users.admin-email=${SEED_ADMIN_EMAIL:admin@contrapposto.local}
app.seed-dev-users.admin-password=${SEED_ADMIN_PASSWORD:admin123}
app.seed-dev-users.model-email=${SEED_MODEL_EMAIL:model@contrapposto.local}
app.seed-dev-users.model-password=${SEED_MODEL_PASSWORD:model123}
app.seed-dev-users.organizer-email=${SEED_ORGANIZER_EMAIL:organizer@contrapposto.local}
app.seed-dev-users.organizer-password=${SEED_ORGANIZER_PASSWORD:organizer123}